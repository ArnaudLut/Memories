# Vérification de l'étape 1 sur les services réels : les rôles SQL, pgvector et
# la sauvegarde de la table témoin sous cloisonnement forcé, contrôlés depuis
# l'instance ; le verrou de l'état ; un plan sans changement. Le résumé du job
# donne le tableau des résultats.
name: Vérifier l'étape 1

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    # Nommer bash active « pipefail » : une étape échoue dès qu'un maillon d'un
    # tube échoue.
    shell: bash

env:
  # Même valeur que la variable image_repository de infra/envs.
  IMAGE_REPOSITORY: ghcr.io/arnaudlut/memories

jobs:
  verify:
    name: Vérification de la préversion
    if: vars.OVH_BOOTSTRAPPED == 'true'
    runs-on: ubuntu-24.04
    env:
      TF_IN_AUTOMATION: "true"
      OVH_ENDPOINT: ${{ vars.OVH_ENDPOINT }}
      OVH_CLIENT_ID: ${{ secrets.OVH_CLIENT_ID }}
      OVH_CLIENT_SECRET: ${{ secrets.OVH_CLIENT_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_S3_SECRET_KEY }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      STATE_REGION: ${{ vars.STATE_REGION }}
      STATE_ENDPOINT: ${{ vars.STATE_ENDPOINT }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
      TF_VAR_project_id: ${{ vars.OVH_PROJECT_ID }}
      TF_VAR_dns_zone: ${{ vars.DNS_ZONE }}
      TF_VAR_hostname: ${{ vars.PREVIEW_HOSTNAME }}
      TF_VAR_acme_email: ${{ vars.ACME_EMAIL }}
      TF_VAR_admin_ssh_public_keys: ${{ vars.ADMIN_SSH_PUBLIC_KEYS || '[]' }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      # L'initialisation précède la recherche de l'image : les contrôles du
      # verrou et du plan tournent ainsi même quand l'image manque.
      - name: Initialiser OpenTofu
        run: scripts/ci/tofu-init.sh infra/envs/preview
      - name: Retrouver l'image de ce commit
        # Le job tourne dans l'image que le workflow « Déployer » a publiée.
        run: |
          docker login ghcr.io --username "$REGISTRY_USER" --password-stdin <<< "$REGISTRY_TOKEN"
          digest=$(scripts/ci/image-digest.sh "$IMAGE_REPOSITORY:$GITHUB_SHA")
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Préparer le canal de déploiement
        # Les sorties sensibles sont masquées, puis écrites dans des fichiers
        # que le runner supprime à la fin du job.
        env:
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          tofu -chdir=infra/envs/preview output -json \
            | scripts/ci/prepare-remote.sh preview "$RUNNER_TEMP/remote"
      - name: Contrôler la base depuis l'instance
        id: database
        # Le rapport complet reste lisible dans le journal de l'étape ; le
        # tableau de synthèse n'en garde que le verdict de chaque contrôle.
        run: scripts/ci/remote.sh job verify | tee "$RUNNER_TEMP/verify-report.json"
      # Les contrôles suivants tournent même si un précédent a échoué : le
      # tableau final les montre tous.
      - name: Contrôler le verrou de l'état
        id: lock
        if: ${{ !cancelled() }}
        run: scripts/ci/state-lock-test.sh "verify/conditional-write-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Contrôler que le plan est vide
        id: plan
        if: ${{ !cancelled() }}
        # « exec » : le script devient le processus de l'étape et reçoit
        # lui-même l'annulation du job, qu'il transmet à OpenTofu.
        run: exec scripts/ci/plan.sh infra/envs/preview --fail-on-change
      - name: Écrire le tableau de synthèse
        if: ${{ !cancelled() }}
        env:
          DATABASE_OUTCOME: ${{ steps.database.outcome }}
          LOCK_OUTCOME: ${{ steps.lock.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: scripts/ci/verify-summary.sh "$RUNNER_TEMP/verify-report.json"
